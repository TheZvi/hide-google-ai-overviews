# Every change to extension/ that lands on main is tested, versioned, signed and published:
#  - GitHub Release with the .crx and the Web Store .zip
#  - GitHub Pages: updates.xml + .crx, which managed Chrome installs poll for auto-updates
#  - Chrome Web Store upload, only if the CWS_* secrets are configured
name: Release
on:
  push:
    branches: [main]
    paths: ["extension/**", "docs/**"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: release, cancel-in-progress: false }
jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      HAS_CWS: ${{ secrets.CWS_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Compute version (major.minor from manifest, patch = run number)
        id: v
        run: |
          base=$(node -p "require('./extension/manifest.json').version.split('.').slice(0,2).join('.')")
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
          VERSION: ${{ steps.v.outputs.version }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build
      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp dist/updates.xml dist/*.crx dist/extension-id.txt site/
          cp docs/index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            dist/hide-google-ai-overviews.crx dist/hide-google-ai-overviews.zip \
            --title "v${{ steps.v.outputs.version }}" --generate-notes
      - name: Chrome Web Store upload (optional)
        if: env.HAS_CWS == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload --auto-publish \
            --source dist/hide-google-ai-overviews.zip \
            --extension-id "$CWS_EXTENSION_ID" --client-id "$CWS_CLIENT_ID" \
            --client-secret "$CWS_CLIENT_SECRET" --refresh-token "$CWS_REFRESH_TOKEN"
